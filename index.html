      { id: 'a-2', customerName: 'Felipe Torres', customerPhone: '0412-5559876', date: '2026-06-03', time: '11:30', serviceId: 's-2', worker: 'Ing. Mateo O.', status: 'confirmed' },
      { id: 'a-3', customerName: 'Lucía Fernández', customerPhone: '0412-5551234', date: '2026-06-02', time: '15:00', serviceId: 's-3', worker: 'Téc. Luis A.', status: 'completed' },
      { id: 'a-4', customerName: 'Roberto Garza', customerPhone: '0416-1112233', date: '2026-06-04', time: '10:00', serviceId: 's-4', worker: 'Ing. Mateo O.', status: 'pending' }

    const INITIAL_INVOICES = [
      {

        items: [
          { productId: 'p-3', name: 'Teclado Mecánico MX Keys', price: 120, quantity: 1 },

      {

        items: [
          { productId: 'p-1', name: 'Laptop Dell XPS 13', price: 1250, quantity: 2 },

        ],

      }
    ];

    const formatMoney = (amount) => {
      return '$' + Number(amount).toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    };

    // --- MAIN APP COMPONENT ---
    function App() {
      const [currentView, setCurrentView] = useState('dashboard');

      // Sidebar states (desktop colapsar y móvil cajón flotante)
      const [sidebarCollapsed, setSidebarCollapsed] = useState(false);
      const [sidebarMobileOpen, setSidebarMobileOpen] = useState(false);

      const [toast, setToast] = useState(null);

      // Database state management
      const [users, setUsers] = useState(() => {
        const saved = localStorage.getItem('APEX_USERS_V3');
        return saved ? JSON.parse(saved) : INITIAL_USERS;
      });

      const [clients, setClients] = useState(() => {
        const saved = localStorage.getItem('APEX_CLIENTS_V3');
        return saved ? JSON.parse(saved) : INITIAL_CLIENTS;
      });

      const [products, setProducts] = useState(() => {
        const saved = localStorage.getItem('APEX_PRODUCTS_V3');
        return saved ? JSON.parse(saved) : INITIAL_PRODUCTS;
      });

      const [services, setServices] = useState(() => {
        const saved = localStorage.getItem('APEX_SERVICES_V3');
        return saved ? JSON.parse(saved) : INITIAL_SERVICES;
      });

      const [appointments, setAppointments] = useState(() => {
        const saved = localStorage.getItem('APEX_APPOINTMENTS_V3');
        return saved ? JSON.parse(saved) : INITIAL_APPOINTMENTS;
      });

      const [invoices, setInvoices] = useState(() => {
        const saved = localStorage.getItem('APEX_INVOICES_V3');
        return saved ? JSON.parse(saved) : INITIAL_INVOICES;
      });

      // Active Session
      const [sessionUser, setSessionUser] = useState(() => {
        const saved = sessionStorage.getItem('APEX_SESSION_USER_V3');
        return saved ? JSON.parse(saved) : null;
      });

      // Redirect hook state
      const [billingRedirectState, setBillingRedirectState] = useState(null);

      // Save database changes
      useEffect(() => {
        localStorage.setItem('APEX_USERS_V3', JSON.stringify(users));
      }, [users]);

      useEffect(() => {
        localStorage.setItem('APEX_CLIENTS_V3', JSON.stringify(clients));
      }, [clients]);

      useEffect(() => {
        localStorage.setItem('APEX_PRODUCTS_V3', JSON.stringify(products));
      }, [products]);

      useEffect(() => {
        localStorage.setItem('APEX_SERVICES_V3', JSON.stringify(services));
      }, [services]);

      useEffect(() => {
        localStorage.setItem('APEX_APPOINTMENTS_V3', JSON.stringify(appointments));
      }, [appointments]);

      useEffect(() => {
        localStorage.setItem('APEX_INVOICES_V3', JSON.stringify(invoices));
      }, [invoices]);

      // Intentar cargar desde API si está disponible (caída a localStorage si no)
      const [apiAvailable, setApiAvailable] = useState(false);
      useEffect(() => {
        let mounted = true;
        async function loadFromApi() {
          try {
            const ping = await fetch('/api/ping');
            if (!ping.ok) throw new Error('API no disponible');

            const [uRes, cRes, pRes, sRes, aRes, iRes] = await Promise.all([
              fetch('/api/users'), fetch('/api/clients'), fetch('/api/products'), fetch('/api/services'), fetch('/api/appointments'), fetch('/api/invoices')
            ]);

            const [u, c, p, s, a, i] = await Promise.all([uRes.json(), cRes.json(), pRes.json(), sRes.json(), aRes.json(), iRes.json()]);

            if (!mounted) return;
            if (Array.isArray(u) && u.length > 0) setUsers(u);
            if (Array.isArray(c) && c.length > 0) setClients(c);
            if (Array.isArray(p) && p.length > 0) setProducts(p);
            if (Array.isArray(s) && s.length > 0) setServices(s);
            if (Array.isArray(a) && a.length > 0) setAppointments(a);
            if (Array.isArray(i) && i.length > 0) setInvoices(i);

            setApiAvailable(true);
            console.log('Datos cargados desde API');
          } catch (err) {
            console.log('API no detectada, se mantiene localStorage:', err.message);
          }
        }
        loadFromApi();
        return () => { mounted = false; };
      }, []);

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 4000);
      };

      const handleLogin = (email, password) => {
        const foundUser = users.find(u => u.email === email && u.password === password);
        if (foundUser) {
          setSessionUser(foundUser);
          sessionStorage.setItem('APEX_SESSION_USER_V3', JSON.stringify(foundUser));
          setCurrentView('dashboard');
          showToast(`¡Hola, ${foundUser.name}! Bienvenido a tu sesión.`, 'success');
        } else {
          showToast('Credenciales incorrectas.', 'danger');
        }
      };

      const handleLogout = () => {
        setSessionUser(null);
        sessionStorage.removeItem('APEX_SESSION_USER_V3');
        showToast('Sesión finalizada.', 'success');
      };

      const hasPermission = (view) => {
        if (!sessionUser) return false;
        const role = sessionUser.role;
        if (role === 'admin') return true;

        switch (view) {
          case 'dashboard':
            return true;
          case 'invoices':
            return true;
          case 'inventory':
            return true;
          case 'appointments':
            return true;
          case 'clients':
            return role === 'seller' || role === 'scheduler';
          case 'users':
            return false;
          default:
            return false;
        }
      };

      const resetDatabase = () => {
        if (window.confirm('¿Deseas restablecer el sistema completo?')) {
          setUsers(INITIAL_USERS);
          setClients(INITIAL_CLIENTS);
          setProducts(INITIAL_PRODUCTS);
          setServices(INITIAL_SERVICES);
          setAppointments(INITIAL_APPOINTMENTS);
          setInvoices(INITIAL_INVOICES);
          handleLogout();
          showToast('Valores por defecto restablecidos.', 'success');
        }
      };

      if (!sessionUser) {
        return <LoginView onLogin={handleLogin} users={users} />;
      }

      return (
        <div className={`app-container ${sidebarCollapsed ? 'sidebar-collapsed' : ''} ${sidebarMobileOpen ? 'sidebar-mobile-open' : ''}`}>

          {/* [ESTRUCTURA] Overlay de menú móvil */}
          {/* Mobile Overlay backdrop */}
          <div className="sidebar-backdrop" onClick={() => setSidebarMobileOpen(false)}></div>

          {/* [ESTRUCTURA] Notificaciones flotantes */}
          {toast && (
            <div className={`alert-toast ${toast.type === 'danger' ? 'alert-danger' : toast.type === 'success' ? 'alert-success' : ''}`}>
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                {toast.type === 'danger' ? (
                  <>
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                  </>
                ) : (
                  <>
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                    <polyline points="22 4 12 14.01 9 11.01"></polyline>
                  </>
                )}
              </svg>
              <span>{toast.message}</span>
            </div>
          )}

          {/* [NAVEGACIÓN] Menú lateral de la aplicación */}
          {/* Navigation Sidebar Drawer */}
          <aside className="sidebar">
            <div className="sidebar-logo">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                <line x1="8" y1="21" x2="16" y2="21"></line>
                <line x1="12" y1="17" x2="12" y2="21"></line>
              </svg>
              <span className="logo-text">APEX FLOW</span>
            </div>

            <ul className="sidebar-menu">
              <li className="menu-item">
                <a className={`menu-link ${currentView === 'dashboard' ? 'active' : ''}`} onClick={() => { setCurrentView('dashboard'); setSidebarMobileOpen(false); }}>
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2h-2a2 2 0 01-2-2v-4z" />
                  </svg>
                  <span>Panel General</span>
                </a>
              </li>

              <li className="menu-item">
                <a className={`menu-link ${currentView === 'invoices' ? 'active' : ''}`} onClick={() => { setCurrentView('invoices'); setSidebarMobileOpen(false); }}>
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                  </svg>
                  <span>Facturación</span>
                </a>
              </li>

              <li className="menu-item">
                <a className={`menu-link ${currentView === 'inventory' ? 'active' : ''}`} onClick={() => { setCurrentView('inventory'); setSidebarMobileOpen(false); }}>
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
                  </svg>
                  <span>Almacén / Stock</span>
                </a>
              </li>

              <li className="menu-item">
                <a className={`menu-link ${currentView === 'clients' ? 'active' : ''}`} onClick={() => { setCurrentView('clients'); setSidebarMobileOpen(false); }}>
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
                  </svg>
                  <span>Clientes</span>
                </a>
              </li>

              <li className="menu-item">
                <a className={`menu-link ${currentView === 'appointments' ? 'active' : ''}`} onClick={() => { setCurrentView('appointments'); setSidebarMobileOpen(false); }}>
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                  </svg>
                  <span>Citas y Agenda</span>
                </a>
              </li>

              {sessionUser.role === 'admin' && (
                <li className="menu-item">
                  <a className={`menu-link ${currentView === 'users' ? 'active' : ''}`} onClick={() => { setCurrentView('users'); setSidebarMobileOpen(false); }}>
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
                    </svg>
                    <span>Usuarios & Accesos</span>
                  </a>
                </li>
              )}
            </ul>

            <div className="sidebar-footer">
              <button onClick={handleLogout} className="btn btn-danger" style={{ width: '100%' }}>
                Cerrar Sesión
              </button>
              <button onClick={resetDatabase} className="btn btn-secondary" style={{ width: '100%', fontSize: '0.75rem', padding: '6px' }}>
                Restablecer Demo
              </button>
            </div>
          </aside>

          {/* [ÁREA PRINCIPAL] Contenido dinámico según vista activa */}
          {/* Main Area Wrapper */}
          <main className="main-wrapper">
            <header className="topbar">
              <div className="topbar-title-section">
                <button className="menu-toggle" onClick={() => {
                  if (window.innerWidth <= 768) {
                    setSidebarMobileOpen(!sidebarMobileOpen);
                  } else {
                    setSidebarCollapsed(!sidebarCollapsed);
                  }
                }}>
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                  </svg>
                </button>
                <h1 className="page-title">
                  {currentView === 'dashboard' && 'Panel General'}
                  {currentView === 'invoices' && 'Cobros de Facturación'}
                  {currentView === 'inventory' && 'Inventario de Almacén'}
                  {currentView === 'clients' && 'Control de Clientes & Deudas'}
                  {currentView === 'appointments' && 'Citas & Servicios'}
                  {currentView === 'users' && 'Usuarios & Permisos'}
                </h1>
              </div>

              <div className="topbar-actions">
                <div className="flex-gap-sm">
                  <span style={{ fontSize: '0.825rem', color: 'var(--text-secondary)' }}>Operador: <strong style={{ color: 'var(--text-primary)' }}>{sessionUser.name}</strong></span>
                  <span className={`role-tag role-${sessionUser.role}`}>
                    {sessionUser.role.toUpperCase()}
                  </span>
                </div>
              </div>
            </header>

            <div className="content-body">
              {hasPermission(currentView) ? (
                <>
                  {currentView === 'dashboard' && (
                    <DashboardView
                      products={products}
                      invoices={invoices}
                      appointments={appointments}
                      clients={clients}
                      showToast={showToast}
                    />
                  )}
                  {currentView === 'invoices' && (
                    <InvoicesView
                      products={products}
                      setProducts={setProducts}
                      invoices={invoices}
                      setInvoices={setInvoices}
                      clients={clients}
                      setClients={setClients}
                      currentUser={sessionUser}
                      billingRedirectState={billingRedirectState}
                      setBillingRedirectState={setBillingRedirectState}
                      showToast={showToast}
                    />
                  )}
                  {currentView === 'inventory' && (
                    <InventoryView
                      products={products}
                      setProducts={setProducts}
                      currentUser={sessionUser}
                      showToast={showToast}
                    />
                  )}
                  {currentView === 'clients' && (
                    <ClientsView
                      clients={clients}
                      setClients={setClients}
                      currentUser={sessionUser}
                      showToast={showToast}
                    />
                  )}
                  {currentView === 'appointments' && (
                    <AppointmentsView
                      appointments={appointments}
                      setAppointments={setAppointments}
                      services={services}
                      setServices={setServices}
                      currentUser={sessionUser}
                      setCurrentView={setCurrentView}
                      setBillingRedirectState={setBillingRedirectState}
                      showToast={showToast}
                    />
                  )}
                  {currentView === 'users' && (
                    <UsersView
                      users={users}
                      setUsers={setUsers}
                      currentUser={sessionUser}
                      showToast={showToast}
                    />
                  )}
                </>
              ) : (
                <div className="unauthorized-panel">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                  </svg>
                  <h3 className="unauthorized-title">Módulo Protegido</h3>
                  <p>Tu rol de <strong>{sessionUser.role.toUpperCase()}</strong> no tiene accesos autorizados para ver este apartado.</p>
                </div>
              )}
            </div>
          </main>
        </div>
      );
    }

    // --- VISTA: PANTALLA DE INICIO DE SESIÓN ---
    function LoginView({ onLogin, users }) {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');

      const handleSubmit = (e) => {
        e.preventDefault();
        onLogin(email, password);
      };

      return (
        <div className="login-container">
          <div className="login-card">
            <div className="login-header">
              <div className="login-logo">
                <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
                  <path d="M2 17l10 5 10-5"></path>
                  <path d="M2 12l10 5 10-5"></path>
                </svg>
              </div>
              <h2 style={{ fontSize: '1.4rem', fontWeight: 800 }}>APEX FLOW</h2>

    // --- VISTA: TABLERO GENERAL ---
    function DashboardView({ products, invoices, appointments, clients, showToast }) {
      const totalSales = useMemo(() => invoices.reduce((sum, inv) => sum + inv.total, 0), [invoices]);

      const totalProfit = useMemo(() => {
        return invoices.reduce((sum, inv) => {
          let invoiceCost = 0;
          inv.items.forEach(item => {
            const matched = products.find(p => p.id === item.productId);
            const cost = matched ? matched.cost : (item.price * 0.6);
            invoiceCost += (cost * item.quantity);
          });
          return sum + (inv.subtotal - invoiceCost);
        }, 0);
      }, [invoices, products]);

      const lowStockCount = useMemo(() => products.filter(p => p.stock <= p.minStock).length, [products]);
      const pendingAppointments = useMemo(() => appointments.filter(a => a.status === 'pending' || a.status === 'confirmed').length, [appointments]);
      const clientCreditsTotal = useMemo(() => clients.reduce((sum, cl) => sum + (cl.balance || 0), 0), [clients]);

      const chartData = useMemo(() => {
        const days = ['28 May', '29 May', '30 May', '31 May', '01 Jun', '02 Jun'];
        const values = [450, 980, 250, 1200, 3236, totalSales > 0 ? totalSales / 1.4 : 500];
        return days.map((day, idx) => ({
          label: day,
          ventas: values[idx],
          costos: values[idx] * 0.6
        }));
      }, [totalSales]);

      return (
        <div style={{ display: 'flex', flexDirection: 'column', gap: '24px' }}>
          {lowStockCount > 0 && (
            <div className="card text-warning" style={{ display: 'flex', alignItems: 'center', gap: '16px', borderLeft: '5px solid var(--warning)', padding: '16px 24px' }}>

                <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                <line x1="12" y1="9" x2="12" y2="13"></line>
                <line x1="12" y1="17" x2="12.01" y2="17"></line>
              </svg>
              <div>
                <strong>Stock Crítico Detectado</strong>
                <p style={{ fontSize: '0.85rem', color: 'var(--text-secondary)', marginTop: '2px' }}>Existen {lowStockCount} artículos por debajo del inventario de seguridad.</p>
              </div>

            <div className="card stat-card">

                    const groupSpacing = 85;
                    const startX = 75 + (index * groupSpacing);
                    const maxVal = 3500;
                    const maxH = 170;
                    const hVentas = (data.ventas / maxVal) * maxH;
                    const yVentas = 200 - hVentas;
                    const hCostos = (data.costos / maxVal) * maxH;

    // --- VISTA: FACTURACIÓN Y COBROS (POSIBLE ESCÁNER) ---
    function InvoicesView({ products, setProducts, invoices, setInvoices, clients, setClients, currentUser, billingRedirectState, setBillingRedirectState, showToast }) {
      const [isCreating, setIsCreating] = useState(false);
      const [searchTerm, setSearchTerm] = useState('');

      const [viewingInvoice, setViewingInvoice] = useState(null);

      // Create Invoice Form States
      const [selectedClientId, setSelectedClientId] = useState('');
      const [invoiceItems, setInvoiceItems] = useState([]);
      const [selectedProductId, setSelectedProductId] = useState('');
      const [selectedQuantity, setSelectedQuantity] = useState(1);

      // Scanner states
      const [barcodeInput, setBarcodeInput] = useState('');
      const [showCameraScanner, setShowCameraScanner] = useState(false);

      // Checkout states
      const [checkoutModalOpen, setCheckoutModalOpen] = useState(false);
      const [paymentMethod, setPaymentMethod] = useState('efectivo');

      // Payment Details Form States
      const [cashReceived, setCashReceived] = useState('');
      const [pagoMovilRef, setPagoMovilRef] = useState('');
      const [transfRef, setTransfRef] = useState('');
      const [transfBank, setTransfBank] = useState('');
      const [transfCid, setTransfCid] = useState('');
      const [posRef, setPosRef] = useState('');
      const [cuotasDownpayment, setCuotasDownpayment] = useState('');
      const [cuotasPlazo, setCuotasPlazo] = useState(3);

      const canWrite = currentUser.role === 'admin' || currentUser.role === 'seller';

      // Load billingRedirectState if exists (appointment flow)
      useEffect(() => {
        if (billingRedirectState) {
          setIsCreating(true);
          const matched = clients.find(c => c.name.toLowerCase() === billingRedirectState.clientName.toLowerCase());
          if (matched) {
            setSelectedClientId(matched.id);
          } else {
            const newClientId = `c-${Date.now()}`;
            const newClient = {
              id: newClientId,
              name: billingRedirectState.clientName,
              cid: 'V-' + Math.floor(Math.random() * 10000000 + 10000000),
              address: 'Registrado vía cita',
              phone: billingRedirectState.clientPhone || '0412-0000000',
              email: 'cliente.citas@apex.com',
              balance: 0
            };
            setClients(prev => [...prev, newClient]);
            setSelectedClientId(newClientId);
          }

          setInvoiceItems([
            { productId: 'service-linked', name: billingRedirectState.serviceName, price: billingRedirectState.servicePrice, quantity: 1 }
          ]);

          setBillingRedirectState(null);
          showToast('Servicio cargado en facturación.', 'success');
        }
      }, [billingRedirectState, clients, setClients, setBillingRedirectState, showToast]);

      const builderSubtotal = useMemo(() => {
        return invoiceItems.reduce((sum, item) => sum + (item.price * item.quantity), 0);
      }, [invoiceItems]);

      const builderTax = useMemo(() => builderSubtotal * 0.16, [builderSubtotal]);
      const builderTotal = useMemo(() => builderSubtotal + builderTax, [builderSubtotal, builderTax]);

      const calculatedChange = useMemo(() => {
        if (!cashReceived) return 0;
        const diff = Number(cashReceived) - builderTotal;
        return diff >= 0 ? diff : 0;
      }, [cashReceived, builderTotal]);

      const cuotasFinancedAmount = useMemo(() => {
        const dp = cuotasDownpayment ? Number(cuotasDownpayment) : 0;
        const diff = builderTotal - dp;
        return diff >= 0 ? diff : 0;
      }, [cuotasDownpayment, builderTotal]);

      const cuotaIndividualPrice = useMemo(() => {
        return cuotasPlazo > 0 ? (cuotasFinancedAmount / cuotasPlazo) : 0;
      }, [cuotasFinancedAmount, cuotasPlazo]);

      const handleBarcodeSubmit = (e) => {
        e.preventDefault();
        if (!barcodeInput) return;

        const matched = products.find(p => p.sku.toUpperCase() === barcodeInput.toUpperCase());
        if (!matched) {
          showToast(`SKU "${barcodeInput}" no encontrado.`, 'danger');
          setBarcodeInput('');
          return;
        }

        if (matched.stock <= 0) {
          showToast(`Producto ${matched.name} agotado.`, 'danger');
          setBarcodeInput('');
          return;
        }

        const existingIdx = invoiceItems.findIndex(item => item.productId === matched.id);
        if (existingIdx >= 0) {
          const currentQty = invoiceItems[existingIdx].quantity;
          if (currentQty + 1 > matched.stock) {
            showToast(`Sin existencias suficientes.`, 'danger');
            setBarcodeInput('');
            return;
          }
          const updated = [...invoiceItems];
          updated[existingIdx].quantity = currentQty + 1;
          setInvoiceItems(updated);
        } else {
          setInvoiceItems([...invoiceItems, { productId: matched.id, name: matched.name, price: matched.price, quantity: 1 }]);
        }

        setBarcodeInput('');
        showToast(`Escaneado: ${matched.name} agregado.`, 'success');
      };

      const handleAddItemDirectly = () => {
        if (!selectedProductId) return;
        const product = products.find(p => p.id === selectedProductId);
        if (!product) return;

        const existingIdx = invoiceItems.findIndex(i => i.productId === selectedProductId);
        const currentQty = existingIdx >= 0 ? invoiceItems[existingIdx].quantity : 0;
        const requestedQty = currentQty + Number(selectedQuantity);

        if (requestedQty > product.stock) {
          showToast(`Stock insuficiente. Quedan ${product.stock} unidades.`, 'danger');
          return;
        }

        if (existingIdx >= 0) {
          const updated = [...invoiceItems];
          updated[existingIdx].quantity = requestedQty;
          setInvoiceItems(updated);
        } else {
          setInvoiceItems([...invoiceItems, { productId: product.id, name: product.name, price: product.price, quantity: Number(selectedQuantity) }]);
        }
        setSelectedProductId(''); setSelectedQuantity(1);
        showToast('Producto agregado.', 'success');

        if (!canWrite) return;
        setProducts(products.map(p => {
          if (p.id === id) {
            const next = p.stock + amount;
            if (next < 0) return p;
            showToast(`Inventario de ${p.name} ajustado.`, 'success');
            return { ...p, stock: next };
          }
          return p;
        }));
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        const payload = { sku: sku.toUpperCase(), name, category, cost: Number(cost), price: Number(price), stock: Number(stock), minStock: Number(minStock) };
        if (editingProduct) {
          setProducts(products.map(p => (p.id === editingProduct.id ? { ...p, ...payload } : p)));
          showToast('Ficha de artículo guardada.', 'success');
          setEditingProduct(null);
        } else {
          setProducts([...products, { id: `p-${Date.now()}`, ...payload }]);
          showToast('Artículo creado.', 'success');
        }
        setSku(''); setName(''); setCategory(''); setCost(''); setPrice(''); setStock(''); setMinStock('');
        setIsAdding(false);
      };

      const triggerEdit = (p) => {
        setEditingProduct(p); setSku(p.sku); setName(p.name); setCategory(p.category); setCost(p.cost); setPrice(p.price); setStock(p.stock); setMinStock(p.minStock);
        setIsAdding(true);
      };

      const handleDelete = (id, pName) => {
        if (!window.confirm(`¿Borrar ${pName}?`)) return;
        setProducts(products.filter(p => p.id !== id));
        showToast('Artículo eliminado.', 'success');
      };

      const filtered = useMemo(() => {
        return products.filter(p => {
          const sMatch = p.name.toLowerCase().includes(searchTerm.toLowerCase()) || p.sku.toLowerCase().includes(searchTerm.toLowerCase());
          const cMatch = categoryFilter === 'All' || p.category === categoryFilter;
          return sMatch && cMatch;
        });
      }, [products, searchTerm, categoryFilter]);

      return (
        <>
          <div className="card">
            <div className="table-header-controls">
              <h2 className="card-title">Existencias en Almacén</h2>
              <div className="flex-gap-sm">
                <input type="text" placeholder="Buscar SKU..." className="search-field" value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} />
                <select className="filter-select" value={categoryFilter} onChange={(e) => setCategoryFilter(e.target.value)}>
                  {categories.map((cat, idx) => <option key={idx} value={cat}>{cat === 'All' ? 'Todas las Categorías' : cat}</option>)}
                </select>
                {canWrite && (
                  <button className="btn btn-primary" onClick={() => { setEditingProduct(null); setIsAdding(true); }}>
                    Agregar Artículo
                  </button>
                )}
              </div>
            </div>

            <div className="table-wrapper">
              <table className="custom-table">
                <thead>
                  <tr>
                    <th>SKU</th>
                    <th>Nombre</th>
                    <th>Categoría</th>
                    <th>Costo</th>
                    <th>Venta</th>
                    <th>Stock</th>
                    <th>Estatus</th>
                    {canWrite && <th>Acciones</th>}
                  </tr>
                </thead>
                <tbody>
                  {filtered.map(p => (
                    <tr key={p.id}>
                      <td><code>{p.sku}</code></td>
                      <td className="font-bold">{p.name}</td>
                      <td>{p.category}</td>
                      <td>{formatMoney(p.cost)}</td>
                      <td className="text-success font-bold">{formatMoney(p.price)}</td>
                      <td>
                        <div className="flex-gap-sm">
                          {canWrite && <button className="btn-icon-only" style={{ padding: '2px 6px' }} onClick={() => handleQuickStockAdjust(p.id, -1)}>-</button>}
                          <strong style={{ minWidth: '24px', textalign: 'center' }}>{p.stock}</strong>
                          {canWrite && <button className="btn-icon-only" style={{ padding: '2px 6px' }} onClick={() => handleQuickStockAdjust(p.id, 1)}>+</button>}
                        </div>
                      </td>
                      <td>
                        {p.stock === 0 ? <span className="badge badge-danger">Agotado</span> : p.stock <= p.minStock ? <span className="badge badge-warning">Crítico</span> : <span className="badge badge-success">Suficiente</span>}
                      </td>
                      {canWrite && (
                        <td>
                          <div className="flex-gap-sm">
                            <button className="btn-icon-only" onClick={() => triggerEdit(p)}>✎</button>
                            <button className="btn-icon-only text-danger" onClick={() => handleDelete(p.id, p.name)}>✕</button>
                          </div>
                        </td>
                      )}
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>

          {/* ADD PRODUCT MODAL SIBLING */}
          {isAdding && (
            <div className="modal-overlay" onClick={() => setIsAdding(false)}>
              <div className="modal-window" onClick={(e) => e.stopPropagation()}>
                <div className="modal-header">
                  <h3 className="card-title">{editingProduct ? 'Editar Artículo' : 'Ingresar Artículo'}</h3>
                  <button className="btn-icon-only" onClick={() => setIsAdding(false)}>✕</button>
                </div>
                <form onSubmit={handleSubmit}>
                  <div className="modal-body" style={{ display: 'flex', flexDirection: 'column', gap: '12px' }}>
                    <div className="form-row">
                      <div className="form-group">
                        <label className="form-label">SKU</label>
                        <input type="text" className="form-control" value={sku} onChange={(e) => setSku(e.target.value)} required />
                      </div>
                      <div className="form-group">
                        <label className="form-label">Categoría</label>
                        <input type="text" className="form-control" value={category} onChange={(e) => setCategory(e.target.value)} required />
                      </div>
                    </div>
                    <div className="form-group">
                      <label className="form-label">Nombre del Artículo</label>
                      <input type="text" className="form-control" value={name} onChange={(e) => setName(e.target.value)} required />
                    </div>
                    <div className="form-row">
                      <div className="form-group">
                        <label className="form-label">Costo base ($)</label>
                        <input type="number" step="0.01" className="form-control" value={cost} onChange={(e) => setCost(e.target.value)} required />
                      </div>
                      <div className="form-group">
                        <label className="form-label">Precio comercial ($)</label>
                        <input type="number" step="0.01" className="form-control" value={price} onChange={(e) => setPrice(e.target.value)} required />
                      </div>
                    </div>
                    <div className="form-row">
                      <div className="form-group">
                        <label className="form-label">Stock inicial</label>
                        <input type="number" className="form-control" value={stock} onChange={(e) => setStock(e.target.value)} required />
                      </div>
                      <div className="form-group">
                        <label className="form-label">Mínimo de alerta</label>
                        <input type="number" className="form-control" value={minStock} onChange={(e) => setMinStock(e.target.value)} required />
                      </div>
                    </div>
                  </div>
                  <div className="modal-footer">
                    <button type="button" className="btn btn-secondary" onClick={() => setIsAdding(false)}>Cancelar</button>
                    <button type="submit" className="btn btn-primary">Guardar</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </>
      );
    }

    // --- VISTA: CITAS Y AGENDA ---
    function AppointmentsView({ appointments, setAppointments, services, setServices, currentUser, setCurrentView, setBillingRedirectState, showToast }) {
      const [isAddingAppointment, setIsAddingAppointment] = useState(false);
      const [isAddingService, setIsAddingService] = useState(false);
      const [statusFilter, setStatusFilter] = useState('All');

      const [customerName, setCustomerName] = useState('');
      const [customerPhone, setCustomerPhone] = useState('');
      const [appointmentDate, setAppointmentDate] = useState('');
      const [appointmentTime, setAppointmentTime] = useState('');
      const [selectedServiceId, setSelectedServiceId] = useState('');
      const [worker, setWorker] = useState('');

      const [serviceName, setServiceName] = useState('');
      const [serviceDuration, setServiceDuration] = useState('');
      const [servicePrice, setServicePrice] = useState('');

      const canWrite = currentUser.role === 'admin' || currentUser.role === 'scheduler';

      const handleCompleteAndInvoiceLink = (appt) => {
        if (!canWrite) return;
        setAppointments(appointments.map(a => (a.id === appt.id ? { ...a, status: 'completed' } : a)));
        const matched = services.find(s => s.id === appt.serviceId);
        setBillingRedirectState({
          clientName: appt.customerName,
          clientPhone: appt.customerPhone,
          serviceName: matched ? matched.name : 'Servicio Técnico',
          servicePrice: matched ? matched.price : 50
        });
        showToast('Cita completada. Redirigiendo a caja de cobro...', 'success');
        setCurrentView('invoices');
      };

      const handleAddAppointment = (e) => {
        e.preventDefault();
        const newAppt = { id: `a-${Date.now()}`, customerName, customerPhone: customerPhone || '0412-0000000', date: appointmentDate, time: appointmentTime, serviceId: selectedServiceId, worker, status: 'pending' };
        setAppointments([...appointments, newAppt]);
        setIsAddingAppointment(false);
        setCustomerName(''); setCustomerPhone(''); setAppointmentDate(''); setAppointmentTime(''); setSelectedServiceId(''); setWorker('');
        showToast('Turno agendado.', 'success');
      };

      const handleAddService = (e) => {
        e.preventDefault();
        const newService = { id: `s-${Date.now()}`, name: serviceName, duration: Number(serviceDuration), price: Number(servicePrice) };
        setServices([...services, newService]);
        setIsAddingService(false);
        setServiceName(''); setServiceDuration(''); setServicePrice('');
        showToast('Servicio añadido.', 'success');
      };

      const handleUpdateStatus = (id, status) => {
        if (!canWrite) return;
        setAppointments(appointments.map(a => (a.id === id ? { ...a, status } : a)));
        showToast('Estatus de cita guardado.', 'success');
      };

      const filtered = useMemo(() => {
        if (statusFilter === 'All') return appointments;
        return appointments.filter(a => a.status === statusFilter);
      }, [appointments, statusFilter]);

      return (
        <>
          <div className="dashboard-details-grid" style={{ gridTemplateColumns: '2fr 1fr' }}>
            <div className="card">
              <div className="table-header-controls">
                <h3 className="card-title">Agenda Diaria de Turnos</h3>
                <div className="flex-gap-sm">
                  <select className="filter-select" value={statusFilter} onChange={(e) => setStatusFilter(e.target.value)}>
                    <option value="All">Todos</option>
                    <option value="pending">Pendientes</option>
                    <option value="confirmed">Confirmados</option>
                    <option value="completed">Completados</option>
                    <option value="cancelled">Cancelados</option>
                  </select>
                  {canWrite && (
                    <button className="btn btn-primary" onClick={() => setIsAddingAppointment(true)}>
                      Agendar Turno
                    </button>
                  )}
                </div>
              </div>

              <div className="table-wrapper">
                <table className="custom-table">
                  <thead>
                    <tr>
                      <th>Cliente</th>
                      <th>Fecha / Hora</th>
                      <th>Servicio</th>
                      <th>Especialista</th>
                      <th>Estatus</th>
                      {canWrite && <th>Acciones</th>}
                    </tr>
                  </thead>
                  <tbody>
                    {filtered.map(appt => {
                      const matched = services.find(s => s.id === appt.serviceId);
                      return (
                        <tr key={appt.id}>
                          <td>
                            <div style={{ display: 'flex', flexDirection: 'column' }}>
                              <span className="font-bold">{appt.customerName}</span>
                              <span style={{ fontSize: '0.75rem', color: 'var(--text-secondary)' }}>{appt.customerPhone}</span>
                            </div>
                          </td>
                          <td>
                            <span>{appt.date}</span><br />
                            <strong className="text-success">{appt.time} hrs</strong>
                          </td>
                          <td className="font-bold">{matched ? matched.name : 'Servicio'}</td>
                          <td>{appt.worker}</td>
                          <td>
                            {appt.status === 'pending' && <span className="badge badge-warning">Pendiente</span>}
                            {appt.status === 'confirmed' && <span className="badge badge-success" style={{ backgroundColor: 'var(--accent-primary-light)', color: 'var(--accent-primary)', borderColor: 'rgba(79, 70, 229, 0.1)' }}>Confirmada</span>}
                            {appt.status === 'completed' && <span className="badge badge-success">Completada</span>}
                            {appt.status === 'cancelled' && <span className="badge badge-danger">Cancelada</span>}
                          </td>
                          {canWrite && (
                            <td>
                              <div className="flex-gap-sm">
                                {appt.status === 'pending' && <button className="btn-icon-only text-success" onClick={() => handleUpdateStatus(appt.id, 'confirmed')}>✓</button>}
                                {appt.status !== 'completed' && appt.status !== 'cancelled' && (
                                  <>
                                    <button className="btn btn-success" style={{ padding: '2px 6px', fontSize: '0.7rem' }} onClick={() => handleCompleteAndInvoiceLink(appt)}>Completar & Cobrar</button>
                                    <button className="btn-icon-only text-danger" onClick={() => handleUpdateStatus(appt.id, 'cancelled')}>✕</button>
                                  </>
                                )}
                              </div>
                            </td>
                          )}
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </div>

            <div className="card">
              <div className="table-header-controls">
                <h3 className="card-title">Oferta de Servicios</h3>
                {canWrite && <button className="btn btn-secondary" style={{ padding: '4px 8px', fontSize: '0.725rem' }} onClick={() => setIsAddingService(true)}>+</button>}
              </div>

              <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
                {services.map(s => (
                  <div key={s.id} style={{ display: 'flex', justifyContent: 'space-between', padding: '10px', border: '1px solid var(--card-border)', borderRadius: '8px' }}>
                    <div>
                      <strong style={{ fontSize: '0.8rem', display: 'block' }}>{s.name}</strong>
                      <span style={{ fontSize: '0.7rem', color: 'var(--text-secondary)' }}>⏱ {s.duration} mins</span>
                    </div>
                    <span className="text-success font-bold" style={{ fontSize: '0.85rem' }}>{formatMoney(s.price)}</span>
                  </div>
                ))}
              </div>
            </div>
          </div>

          {/* APPOINTMENT MODALS SIBLINGS */}
          {isAddingAppointment && (
            <div className="modal-overlay" onClick={() => setIsAddingAppointment(false)}>
              <div className="modal-window" onClick={(e) => e.stopPropagation()}>
                <div className="modal-header">
                  <h3 className="card-title">Agendar Turno</h3>
                  <button className="btn-icon-only" onClick={() => setIsAddingAppointment(false)}>✕</button>
                </div>
                <form onSubmit={handleAddAppointment}>
                  <div className="modal-body" style={{ display: 'flex', flexDirection: 'column', gap: '12px' }}>
                    <div className="form-group">
                      <label className="form-label">Nombre del Cliente</label>
                      <input type="text" className="form-control" value={customerName} onChange={(e) => setCustomerName(e.target.value)} required />
                    </div>
                    <div className="form-group">
                      <label className="form-label">Teléfono</label>
                      <input type="tel" className="form-control" value={customerPhone} onChange={(e) => setCustomerPhone(e.target.value)} />
                    </div>
                    <div className="form-row">
                      <div className="form-group">
                        <label className="form-label">Fecha</label>
                        <input type="date" className="form-control" value={appointmentDate} onChange={(e) => setAppointmentDate(e.target.value)} required />
                      </div>
                      <div className="form-group">
                        <label className="form-label">Hora</label>
                        <input type="time" className="form-control" value={appointmentTime} onChange={(e) => setAppointmentTime(e.target.value)} required />
                      </div>
                    </div>
                    <div className="form-row">
                      <div className="form-group">
                        <label className="form-label">Servicio</label>
                        <select className="form-control" value={selectedServiceId} onChange={(e) => setSelectedServiceId(e.target.value)} required>
                          <option value="">-- Selecciona --</option>
                          {services.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                        </select>
                      </div>
                      <div className="form-group">
                        <label className="form-label">Especialista TI</label>
                        <input type="text" className="form-control" value={worker} onChange={(e) => setWorker(e.target.value)} required />
                      </div>
                    </div>
                  </div>
                  <div className="modal-footer">
                    <button type="button" className="btn btn-secondary" onClick={() => setIsAddingAppointment(false)}>Cancelar</button>
                    <button type="submit" className="btn btn-primary">Agendar</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {isAddingService && (
            <div className="modal-overlay" onClick={() => setIsAddingService(false)}>
              <div className="modal-window" style={{ maxWidth: '350px' }} onClick={(e) => e.stopPropagation()}>
                <div className="modal-header">
                  <h3 className="card-title">Registrar Servicio</h3>
                  <button className="btn-icon-only" onClick={() => setIsAddingService(false)}>✕</button>
                </div>
                <form onSubmit={handleAddService}>
                  <div className="modal-body" style={{ display: 'flex', flexDirection: 'column', gap: '12px' }}>
                    <div className="form-group">
                      <label className="form-label">Nombre</label>
                      <input type="text" className="form-control" value={serviceName} onChange={(e) => setServiceName(e.target.value)} required />
                    </div>
                    <div className="form-group">
                      <label className="form-label">Duración (Minutos)</label>
                      <input type="number" className="form-control" value={serviceDuration} onChange={(e) => setServiceDuration(e.target.value)} required />
                    </div>
                    <div className="form-group">
                      <label className="form-label">Costo comercial ($)</label>
                      <input type="number" className="form-control" value={servicePrice} onChange={(e) => setServicePrice(e.target.value)} required />
                    </div>
                  </div>
                  <div className="modal-footer">
                    <button type="button" className="btn btn-secondary" onClick={() => setIsAddingService(false)}>Cancelar</button>
                    <button type="submit" className="btn btn-primary">Registrar</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </>
      );
    }

    // Render the React app
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>

</html>
